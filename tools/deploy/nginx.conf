# Serves the site the way Vercel does: clean URLs, no trailing slash,
# the security headers and asset caching from vercel.json, and 404.html
# on a miss. Used by tools/deploy/Dockerfile; not deployed to Vercel.
server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    add_header X-Content-Type-Options  nosniff                      always;
    add_header Referrer-Policy         strict-origin-when-cross-origin always;
    add_header X-Frame-Options         SAMEORIGIN                    always;

    # /about/ -> /about   (trailingSlash: false)
    rewrite ^/(.*)/$ /$1 permanent;

    # /about.html -> /about, /blog.html -> /blog   (cleanUrls: true)
    location = /index.html { return 301 /; }
    location = /404.html   { internal; }
    location ~ ^(/.+)\.html$ { return 301 $1; }

    location /assets/ {
        add_header X-Content-Type-Options  nosniff                      always;
        add_header Referrer-Policy         strict-origin-when-cross-origin always;
        add_header X-Frame-Options         SAMEORIGIN                    always;
        add_header Cache-Control "public, max-age=31536000, immutable"   always;
    }

    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    error_page 404 /404.html;
}
